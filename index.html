<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>你家孩子的教育方向偏了吗？ | 广安曾老师</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0f1923;color:#e8eaed;line-height:1.8;min-height:100vh;}
.container{max-width:480px;margin:0 auto;padding:24px 20px 60px;}
.brand{text-align:center;margin-bottom:32px;}
.brand-name{font-size:14px;color:#5a8ab8;letter-spacing:2px;}
.brand-tag{font-size:12px;color:#4a6577;margin-top:4px;}

.progress-wrap{margin-bottom:32px;}
.progress-bar{height:4px;background:#1a2a3a;border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,#2b5797,#3d7fc4);border-radius:2px;transition:width 0.4s ease;}
.progress-text{font-size:12px;color:#5a7a9a;margin-top:8px;text-align:center;}

.question-card{background:#1a2837;border-radius:12px;padding:24px 20px;margin-bottom:20px;}
.question-num{font-size:12px;color:#3d7fc4;margin-bottom:12px;letter-spacing:1px;}
.question-text{font-size:17px;color:#e8eaed;margin-bottom:24px;line-height:1.6;}
.options{display:flex;flex-direction:column;gap:12px;}
.option{background:#0f1923;border:1px solid #2a3a4a;border-radius:8px;padding:16px;cursor:pointer;transition:all 0.2s;font-size:15px;color:#b0bccc;}
.option:hover{border-color:#3d7fc4;background:#152535;}
.option.selected{border-color:#3d7fc4;background:#1a3a5a;color:#e8eaed;}
.option .label{display:inline-block;width:28px;height:28px;line-height:28px;text-align:center;border-radius:50%;background:#2a3a4a;font-size:13px;margin-right:10px;}
.option.selected .label{background:#3d7fc4;color:#fff;}

.result-card{background:#1a2837;border-radius:12px;padding:32px 24px;text-align:center;}
.result-title{font-size:22px;color:#e8eaed;margin-bottom:8px;font-weight:bold;}
.result-sub{font-size:14px;color:#5a8ab8;margin-bottom:28px;}
.item-result{background:#0f1923;border-radius:8px;padding:16px;margin-bottom:14px;text-align:left;border-left:3px solid #3d7fc4;}
.item-name{font-size:15px;color:#e8a03d;font-weight:bold;margin-bottom:6px;}
.item-status{font-size:13px;color:#5a8ab8;margin-bottom:8px;}
.item-desc{font-size:14px;color:#b0bccc;line-height:1.7;}
.item-suggest{font-size:14px;color:#3d7fc4;margin-top:10px;padding-top:10px;border-top:1px dashed #2a3a4a;line-height:1.7;}
.item-suggest strong{color:#5ab4e8;}
.result-cta{font-size:14px;color:#5a8ab8;margin-top:28px;padding-top:24px;border-top:1px solid #2a3a4a;line-height:1.8;}
.result-cta a{color:#3d7fc4;text-decoration:none;border-bottom:1px dashed #3d7fc4;padding-bottom:1px;}

.btn{display:block;width:100%;padding:16px;text-align:center;background:linear-gradient(135deg,#2b5797,#3d7fc4);color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;transition:opacity 0.2s;margin-top:16px;}
.btn:hover{opacity:0.9;}

.start-card{text-align:center;padding:40px 20px;}
.start-title{font-size:24px;color:#e8eaed;margin-bottom:12px;font-weight:bold;}
.start-sub{font-size:14px;color:#5a8ab8;margin-bottom:32px;}
.start-desc{font-size:14px;color:#8899aa;line-height:2;text-align:left;margin-bottom:32px;padding:20px;background:#1a2837;border-radius:8px;}
.start-desc strong{color:#3d7fc4;}

.share-tip{font-size:12px;color:#4a6577;text-align:center;margin-top:24px;}

.hidden{display:none;}
</style>
</head>
<body>
<div class="container">
  <div class="brand">
    <div class="brand-name">广安曾老师</div>
    <div class="brand-tag">20年教育系统内部人，帮你少走弯路</div>
  </div>

  <div id="startPage">
    <div class="start-card">
      <div class="start-title">你家孩子的教育方向偏了吗？</div>
      <div class="start-sub">5道题 · 2分钟 · 曾老师帮你照照镜子</div>
      <div class="start-desc">
        我在广安教育系统干了20年，管过上万个学生。<br>
        见过太多家长——不是不用心，是方向偏了，越用力越偏。<br><br>
        <strong>这个测试帮你看一件事：</strong><br>
        在5个最关键的教育决策上，你有没有踩中那些最常见的坑。<br><br>
        不打分，不评判。<br>
        就是帮你看看，你跟大多数家长一样不一样。
      </div>
      <button class="btn" onclick="startTest()">开始测试</button>
      <div class="share-tip">做完会给你曾老师的具体建议</div>
    </div>
  </div>

  <div id="quizPage" class="hidden">
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText"></div>
    </div>
    <div id="questionContainer"></div>
    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>下一题</button>
  </div>

  <div id="resultPage" class="hidden">
    <div class="result-card">
      <div class="result-title">你的教育方向体检报告</div>
      <div class="result-sub">曾老师看了20年的经验，帮你看看哪些地方该调一调</div>
      <div id="resultContent"></div>
      <div class="result-cta">
        想知道你家孩子的具体情况该怎么调？<br>
        关注「广安曾老师」<br>
        每篇文章帮你拆一个真实问题<br>
        <a href="https://mp.weixin.qq.com">点击关注公众号</a>
      </div>
    </div>
    <button class="btn" onclick="location.reload()" style="margin-top:16px;background:#1a2837;border:1px solid #2a3a4a;">重新测试</button>
  </div>
</div>

<script>
var questions = [
  {
    text: "你觉得决定孩子未来最重要的是什么？",
    options: [
      {text: "成绩排名，分数是硬通货", type: "trap"},
      {text: "技能特长，多一项本事多条路", type: "trap"},
      {text: "学历文凭，好学校才有好工作", type: "trap"},
      {text: "遇到事情能拿主意、能扛事", type: "clear"}
    ]
  },
  {
    text: "孩子遇到真正困难的时候，他第一个想找谁说？",
    options: [
      {text: "谁也不找，自己扛着", type: "trap"},
      {text: "找同学朋友", type: "neutral"},
      {text: "找老师", type: "neutral"},
      {text: "找爸妈，他知道不会挨骂", type: "clear"}
    ]
  },
  {
    text: "孩子刚出生时你最大的期望，跟现在一样吗？",
    options: [
      {text: "不一样了，现在最要紧是先考上个好学校", type: "trap"},
      {text: "差不多，但重心从健康快乐变成成绩了", type: "trap"},
      {text: "没仔细想过，走一步看一步", type: "neutral"},
      {text: "一样，还是盼着他独立、健康、有担当", type: "clear"}
    ]
  },
  {
    text: "孩子最近成绩下降或状态不好，你的第一反应是？",
    options: [
      {text: "赶紧补课，加课加量", type: "trap"},
      {text: "批评他，让他端正态度", type: "trap"},
      {text: "是不是该换个班或换个学校", type: "trap"},
      {text: "先想想最近家里或学校发生了什么变化", type: "clear"}
    ]
  },
  {
    text: "下面哪件事你觉得对孩子最「有用」？",
    options: [
      {text: "这周考试成绩提高了几分", type: "trap"},
      {text: "这周学会了一个新技能", type: "trap"},
      {text: "这周孩子主动跟你聊了一次心里话", type: "clear"},
      {text: "这周孩子自己搞定了一个麻烦事", type: "clear"}
    ]
  }
];

var results = [
  {
    name: "你给孩子定的目标",
    trap: {
      status: "这个方向可能要调一调",
      desc: "你选的是成绩、技能或学历。这些当然重要，但我在学校干了20年，见过太多孩子——成绩好的到了社会上不一定行，技能多的被AI替代得最快。真正拉开差距的，是孩子遇到事情能不能自己拿主意、能不能扛住压力。这些东西学校不考、简历上写不出来，但十年后决定你家孩子值多少钱。",
      suggest: "不是说不管成绩。而是每天花十分钟想想：今天孩子有没有机会自己做一次决定？哪怕是小事。判断力是练出来的，不是教出来的。"
    },
    clear: {
      status: "这个方向对的",
      desc: "你选的是「能拿主意、能扛事」。说实话，能想到这一层的家长不多。这个目标见效慢、不能发朋友圈炫耀，但它是AI时代真正值钱的东西。你的孩子在这一点上已经比别人家孩子多了几分胜算。",
      suggest: "方向对了，但日常做起来不容易——因为周围所有人都在逼你回到「盯成绩」的老路上。你得顶住这个压力。"
    },
    neutral: {
      status: "这个方向可能要调一调",
      desc: "你选了技能特长。多学点本事没坏处，但你有没有想过：孩子学的那些技能，十年后还有没有用？编程、书法、钢琴——AI比他做得更好更快。与其让他练十种工具，不如让他练一种能力：看懂问题本质的能力。",
      suggest: "报班不是不能报，保留孩子真正喜欢的一两个就行。把省下来的时间，花在让他接触真实问题上。"
    }
  },
  {
    name: "你跟孩子的关系",
    trap: {
      status: "这个要重视",
      desc: "孩子遇到困难不找你，说明他要么觉得说了也没用，要么怕说了挨骂。我在学校见得太多了——很多家长给孩子报班花了几万块，但孩子真正遇到事的时候，连个说话的人都没有。你投的那些钱，叫「要素」。孩子愿意跟你说话，叫「连接」。要素花得到钱买到，连接买不到。",
      suggest: "今天回去试一件事：跟孩子聊五分钟，不问成绩、不问作业、不催任何事，就听他说。看看他愿不愿意开口。如果不愿意，说明连接已经断了，得慢慢修。"
    },
    clear: {
      status: "这个做得好",
      desc: "孩子遇到困难愿意找你，这是你给他最值钱的东西——比任何培训班都值钱。连接在，你对他就有影响力；连接断了，你说什么他都听不进去。",
      suggest: "继续保持。但记住：连接不是一劳永逸的，孩子越大越需要你换方式——从「管」变成「听」。"
    },
    neutral: {
      status: "这个要注意了",
      desc: "孩子不找你，找同学或老师。这说明你不是他的第一选择了。可能是他在长大，也可能你们之间的信任在减弱。不是坏事，但值得留意。",
      suggest: "想想：孩子上次主动跟你分享学校里的事是什么时候？如果记不清了，可能你们之间的距离在拉大。"
    }
  },
  {
    name: "你的教育初心",
    trap: {
      status: "你的初心被悄悄换掉了",
      desc: "孩子刚出生时你盼的是健康快乐。后来变成了考上好学校、拿好成绩。这不是你的错——是整个系统在拉着所有人往一个方向跑。但你不警觉的话，孩子会变成一个分数机器，丢掉你最初最看重的东西。我在学校见过太多这样的家长——走着走着就忘了当初为什么出发。",
      suggest: "今天花五分钟想想：如果孩子考上了好学校，但不快乐、不独立，你满意吗？如果不满意，说明你的初心还在——只是被每天的焦虑盖住了。把它找回来。"
    },
    clear: {
      status: "你的初心还在",
      desc: "你还记着最初那个最朴素的期望——独立、健康、有担当。这很难得。大多数家长在这个过程中都会被系统的标准替换掉自己的标准，但你没有。",
      suggest: "保持这份清醒。但也要注意：坚持初心不等于不管成绩，而是管成绩的同时不忘记初心。"
    },
    neutral: {
      status: "你的初心可能模糊了",
      desc: "你没仔细想过这个问题。很多家长都这样——不是不在乎，是太忙了，没时间想。但不想清楚，你就会跟着大流走——别人报班你也报，别人补课你也补，最后忘了自己到底要什么。",
      suggest: "花五分钟想想：孩子刚出生时你对他最大的期望是什么？现在呢？两个答案之间的差距，就是你需要调整的空间。"
    }
  },
  {
    name: "你看问题的方式",
    trap: {
      status: "你可能把环境的问题当成了孩子的问题",
      desc: "你的第一反应是改孩子——补课、批评、换班。但你想过没有：孩子状态不好，可能不是他自己的问题，是他身边的环境变了。换了班主任、跟同学闹矛盾、家里最近气氛紧张——这些才是根子。你改孩子没用，得改环境。就像庄稼长不好，你不换土，光施肥有什么用？",
      suggest: "下次孩子状态不好的时候，先别急着批评或补课。先问自己三个问题：最近家里有没有什么变化？孩子跟老师同学的关系有没有变化？孩子的作息有没有变化？找到根子再动手。"
    },
    clear: {
      status: "你看问题的方式很清醒",
      desc: "你的第一反应不是怪孩子，而是先看环境。这是很清醒的做法。你意识到孩子的状态是环境的产物，不是他故意跟你作对。",
      suggest: "继续保持。找到环境原因之后，你能帮孩子改的是环境，不是逼他改行为。"
    },
    neutral: {
      status: "这个方面可以再想想",
      desc: "你选了换班或换学校。环境确实重要，但换个环境不一定能解决问题——如果根子在家里，换到哪里都一样。而且频繁换环境本身会让孩子更没有安全感。",
      suggest: "在换环境之前，先想清楚：问题到底出在学校还是出在家里？如果是家里的气氛让孩子焦虑，换学校解决不了。"
    }
  },
  {
    name: "你花时间的方式",
    trap: {
      status: "你可能只在追见效快的东西",
      desc: "你觉得考试提分和学会技能最有用，因为它们见效快——这周学了下周就能看到成果。但真正决定孩子未来的东西——判断力、跟人相处的能力、独立解决问题的能力——这些东西见效太慢了，练一年都看不到变化。所以很多家长不知不觉就把时间全投给了见效快的，把那些见效慢但更重要的推到了「以后再说」。",
      suggest: "不用完全停掉补课和技能训练。但每周留一点时间给孩子做这两件事：第一，跟他聊一次心里话（不是问成绩）；第二，让他自己搞定一个麻烦事（你别插手）。这两件事见效慢，但十年后你会感谢自己。"
    },
    clear: {
      status: "你在等那些重要的东西",
      desc: "你知道聊天和独立解决问题比分数更重要，即使它们见效慢。这说明你跟大多数家长不一样——你愿意等那些重要的东西慢慢长出来。这不容易，因为周围所有人都在追快。",
      suggest: "保持耐心。但也要注意：「等」不是什么都不做——你要主动创造让孩子练习判断和连接的机会。"
    },
    neutral: {
      status: "这个方面可以再想想",
      desc: "你选了学会新技能。学技能没坏处，但你有没有想过：孩子学的东西，十年后还有没有用？与其让他练十种可能被淘汰的技能，不如让他练一种永远不过时的能力——遇到事情能自己想办法。",
      suggest: "报班不是不能报。但每周至少留半天时间，让孩子自己做主——做什么都行，你别安排。独立判断的能力，是在没人安排的时候才长出来的。"
    }
  }
];

var currentQ = 0;
var answers = [];
var selectedOption = -1;

function startTest() {
  document.getElementById('startPage').classList.add('hidden');
  document.getElementById('quizPage').classList.remove('hidden');
  currentQ = 0;
  answers = [];
  renderQuestion();
}

function renderQuestion() {
  var q = questions[currentQ];
  var total = questions.length;
  var progress = ((currentQ) / total) * 100;
  document.getElementById('progressFill').style.width = progress + '%';
  document.getElementById('progressText').textContent = '第 ' + (currentQ + 1) + ' / ' + total + ' 题';

  var html = '<div class="question-card">';
  html += '<div class="question-num">第 ' + (currentQ + 1) + ' 题</div>';
  html += '<div class="question-text">' + q.text + '</div>';
  html += '<div class="options">';
  for (var i = 0; i < q.options.length; i++) {
    html += '<div class="option" onclick="selectOption(' + i + ')" data-index="' + i + '">';
    html += '<span class="label">' + String.fromCharCode(65 + i) + '</span>';
    html += q.options[i].text;
    html += '</div>';
  }
  html += '</div></div>';

  document.getElementById('questionContainer').innerHTML = html;
  selectedOption = -1;
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('nextBtn').textContent = currentQ < total - 1 ? '下一题' : '看曾老师怎么说';
}

function selectOption(index) {
  var opts = document.querySelectorAll('.option');
  opts.forEach(function(o) { o.classList.remove('selected'); });
  opts[index].classList.add('selected');
  selectedOption = index;
  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion() {
  if (selectedOption < 0) return;
  var q = questions[currentQ];
  var opt = q.options[selectedOption];
  answers.push({type: opt.type, text: opt.text});
  currentQ++;
  if (currentQ < questions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('quizPage').classList.add('hidden');
  document.getElementById('resultPage').classList.remove('hidden');

  var needAdjust = 0;
  var html = '';
  var names = ["你给孩子定的目标", "你跟孩子的关系", "你的教育初心", "你看问题的方式", "你花时间的方式"];

  for (var i = 0; i < answers.length; i++) {
    var a = answers[i];
    var r = results[i][a.type];
    if (a.type === 'trap') needAdjust++;

    html += '<div class="item-result">';
    html += '<div class="item-name">' + names[i] + '</div>';
    html += '<div class="item-status">' + r.status + '</div>';
    html += '<div class="item-desc">' + r.desc + '</div>';
    html += '<div class="item-suggest"><strong>曾老师的建议：</strong>' + r.suggest + '</div>';
    html += '</div>';
  }

  var summary = '';
  if (needAdjust >= 3) {
    summary = '<div style="font-size:15px;color:#e8eaed;font-weight:bold;margin-bottom:20px;padding:16px;background:#1a2a3a;border-radius:8px;border-left:3px solid #e8a03d;line-height:1.9;">5个方面里有 ' + needAdjust + ' 个可能需要调一调。<br>别慌——我见过太多家长都是这样，不是你一个人。<br>能做完这个测试说明你在想问题了，这已经是改变的第一步。<br>关注「广安曾老师」，我们一篇一篇文章慢慢拆。</div>';
  } else if (needAdjust >= 1) {
    summary = '<div style="font-size:15px;color:#e8eaed;font-weight:bold;margin-bottom:20px;padding:16px;background:#1a2a3a;border-radius:8px;border-left:3px solid #3d7fc4;line-height:1.9;">5个方面里有 ' + needAdjust + ' 个可能需要注意。<br>整体方向不错，个别地方调一调就行。<br>关注「广安曾老师」，每篇文章帮你拆一个真实问题。</div>';
  } else {
